# stainful configuration for Hyver SDK generation
# https://github.com/stainlu/stainful

organization:
  name: hyver-sdk
  docs: https://github.com/DressPD/hyver-sdk

resources:
  health:
    methods:
      check: get /health

  capabilities:
    methods:
      get: get /v1/capabilities

  chat.completions:
    methods:
      create:
        endpoint: post /v1/chat/completions
        streaming:
          type: sse
          param_discriminator: stream
          stream_event_model: ChatCompletionChunk

  runs:
    methods:
      create: post /v1/runs
      stop: post /v1/runs/{run_id}/stop

  runs.events:
    methods:
      stream:
        endpoint: get /v1/runs/{run_id}/events
        streaming:
          type: sse
          stream_event_model: RunEvent

  runs.approval:
    methods:
      submit: post /v1/runs/{run_id}/approval

  # NOTE: the `sessions` resource is intentionally NOT listed here. Session
  # CRUD/history is served by the Hyver *loader* service at a different base URL
  # (loader_base_url / HYVER_LOADER_BASE_URL), so it is hand-maintained in
  # src/hyver/resources/sessions.py + src/hyver/types/session.py and wired up by
  # scripts/post_generate.py (Fix 16). Do not add it as a generated resource.

targets:
  python:
    package_name: hyver
    publish:
      pypi: false

settings:
  license: LicenseRef-Proprietary

client_settings:
  opts:
    bearer_token:
      type: string
      auth:
        security_scheme: BearerAuth
      read_env: HYVER_API_KEY
  environments:
    production: https://hyver.your-domain.com
    local: http://localhost:8643
