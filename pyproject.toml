[project]
name = "hyver-sdk"
version = "0.1.0"
description = "Python SDK for the Hyver Runtime API"
license = "LicenseRef-Proprietary"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Hyver Team" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.7.0",
]

[project.optional-dependencies]
dev = [
    "stainful>=0.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "respx>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hyver"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["src/hyver/_core/", "src/hyver/_utils.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

# Generated transport/runtime infrastructure. Excluded from ruff too (see
# extend-exclude above). These are emitted by stainful + post-patched; their
# type completeness is the generator's concern, not hand-maintained here.
[[tool.mypy.overrides]]
module = ["hyver._core.*", "hyver._utils"]
ignore_errors = true

# Generated resource clients: `no-any-return` fires because they return the
# transport `_request` (typed Any); `comparison-overlap` fires on the generated
# `v is not not_given` body-filter when a request body has only required fields.
# Both are artifacts of the generated pattern, not real defects.
[[tool.mypy.overrides]]
module = ["hyver.resources.*"]
disable_error_code = ["no-any-return", "comparison-overlap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "boto3>=1.43.14",
]
