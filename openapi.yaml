openapi: 3.1.0
info:
  title: Hermes Runtime API
  version: 0.1.0
  description: |
    AI agent runtime API for Hyver. Provides health checks, chat completions
    (OpenAI-compatible via LiteLLM), and agent run management with SSE streaming.
  license:
    name: Proprietary

servers:
  - url: http://localhost:8643
    description: Local Hermes Runtime server

security:
  - BearerAuth: []

tags:
  - name: health
    description: Service health checks
  - name: capabilities
    description: Runtime capability discovery
  - name: chat
    description: OpenAI-compatible chat completions
  - name: runs
    description: Agent run management and streaming

paths:
  /health:
    get:
      operationId: check_health
      summary: Health check
      description: Returns service health status. No authentication required.
      security: []
      tags: [health]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/capabilities:
    get:
      operationId: get_capabilities
      summary: Get runtime capabilities
      description: |
        Returns available runtime capabilities. Proxied directly to the Hermes
        upstream service. No authentication required.
      security: []
      tags: [capabilities]
      responses:
        "200":
          description: Runtime capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"

  /v1/chat/completions:
    post:
      operationId: create_chat_completion
      summary: Create chat completion
      description: |
        OpenAI-compatible chat completion endpoint. Requests are routed through
        a model routing proxy that selects the appropriate model based on
        complexity and tier, then forwarded to LiteLLM.
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: Chat completion response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ChatCompletionChunk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/runs:
    post:
      operationId: create_run
      summary: Create a new agent run
      description: |
        Creates a new agent run with the given input and configuration. Returns
        a run ID that can be used to stream events, submit approvals, or stop
        the run.
      tags: [runs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunCreateRequest"
      responses:
        "202":
          description: |
            Run accepted and started asynchronously. Stream progress from
            `GET /v1/runs/{run_id}/events`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunCreateResponse"
        # The runtime only ever returns 202 (see the "202" entry above, which is
        # the authoritative documentation). This "2XX" duplicate exists solely
        # because the SDK generator derives the typed response body from a fixed
        # status list ("200", "201", "2XX", "default") and would otherwise emit
        # an untyped `object` return for create_run. Keep both in sync.
        "2XX":
          description: |
            Run accepted and started asynchronously. Stream progress from
            `GET /v1/runs/{run_id}/events`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/runs/{run_id}/events:
    get:
      operationId: stream_run_events
      summary: Stream run events via SSE
      description: |
        Opens a Server-Sent Events stream for the specified run. Events include
        content deltas, tool executions, reasoning steps, approval requests,
        usage statistics, and completion/failure signals.
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/RunEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/runs/{run_id}/approval:
    post:
      operationId: submit_run_approval
      summary: Submit approval decision for a run
      description: |
        Approves or rejects a pending action during a run that has
        human-in-the-loop control enabled.
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunApprovalRequest"
      responses:
        "200":
          description: Approval submitted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/runs/{run_id}/stop:
    post:
      operationId: stop_run
      summary: Stop a running agent run
      description: Signals the runtime to stop the specified run.
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run stop requested
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito JWT token

  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
      description: Unique run identifier

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # ── Health ──────────────────────────────────────────────────────────
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [healthy]

    # ── Capabilities ───────────────────────────────────────────────────
    CapabilitiesResponse:
      type: object
      additionalProperties: true
      description: |
        Runtime capabilities. Schema varies by runtime version. Proxied
        directly from the Hermes upstream service.

    # ── Chat Completions (OpenAI-compatible) ───────────────────────────
    ChatCompletionRequest:
      type: object
      required: [messages]
      properties:
        model:
          type: string
          description: Model identifier. May be rewritten by the routing proxy.
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        temperature:
          type: number
          minimum: 0
          maximum: 2
        max_tokens:
          type: integer
        stream:
          type: boolean
          default: false
        top_p:
          type: number
          minimum: 0
          maximum: 1
        stop:
          oneOf:
            - type: string
            - type: array
              items:
                type: string

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string

    ChatCompletionResponse:
      type: object
      required: [id, object, created, choices]
      properties:
        id:
          type: string
        object:
          type: string
          enum: [chat.completion]
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            $ref: "#/components/schemas/ChatChoice"
        usage:
          $ref: "#/components/schemas/CompletionUsage"

    ChatChoice:
      type: object
      required: [index, message, finish_reason]
      properties:
        index:
          type: integer
        message:
          $ref: "#/components/schemas/ChatMessage"
        finish_reason:
          type: string
          enum: [stop, length, content_filter]
          nullable: true

    ChatCompletionChunk:
      type: object
      required: [id, object, created, choices]
      properties:
        id:
          type: string
        object:
          type: string
          enum: [chat.completion.chunk]
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            $ref: "#/components/schemas/ChatChunkChoice"

    ChatChunkChoice:
      type: object
      required: [index, delta]
      properties:
        index:
          type: integer
        delta:
          type: object
          properties:
            role:
              type: string
            content:
              type: string
        finish_reason:
          type: string
          nullable: true

    CompletionUsage:
      type: object
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer

    # ── Run Management ─────────────────────────────────────────────────
    RunCreateRequest:
      type: object
      required: [input, session_id]
      properties:
        input:
          type: string
          description: User message content, may include inline file context.
        session_id:
          type: string
          description: Session identifier for conversation continuity.
        instructions:
          type: string
          description: System instructions override for this run.
        images:
          type: array
          items:
            $ref: "#/components/schemas/ImageAttachment"
          description: Image attachments to include with the message.
        conversation_history:
          type: array
          items:
            $ref: "#/components/schemas/ConversationMessage"
          description: Prior conversation turns for context.
        metadata:
          $ref: "#/components/schemas/RunMetadata"
        tools:
          type: array
          items:
            type: string
          description: Tool identifiers to enable (e.g. "brave").

    RunCreateResponse:
      type: object
      properties:
        run_id:
          type: string
          description: Primary run identifier.
        id:
          type: string
          description: Alternative run identifier field.

    ImageAttachment:
      type: object
      required: [base64, mimeType]
      properties:
        base64:
          type: string
          description: Base64-encoded image data.
        mimeType:
          type: string
          description: "Image MIME type (e.g. image/png, image/jpeg)."
        fileName:
          type: string
        sizeBytes:
          type: integer

    ConversationMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string

    RunMetadata:
      type: object
      properties:
        reasoning:
          type: boolean
          description: Enable reasoning/thinking output.
        search_enabled:
          type: boolean
          description: Enable web search tool.
        human_control:
          type: boolean
          description: Enable human-in-the-loop approval for tool calls.

    RunApprovalRequest:
      description: |
        Resolves a pending approval gate.

        The runtime rejects a boolean body with `400 invalid_approval_choice`;
        `choice` is required. `approve`, `approved` and `allow` are accepted as
        aliases for `once`.
      type: object
      required: [choice]
      properties:
        choice:
          type: string
          description: |
            How to resolve the gate.

            * `once`    -- allow this single invocation
            * `session` -- allow for the remainder of this run
            * `always`  -- allow permanently (only when the
              `approval.request` event set `allow_permanent: true`)
            * `deny`    -- reject the invocation
          enum: [once, session, always, deny, approve, approved, allow]
        all:
          type: boolean
          description: >-
            Apply the choice to every pending approval for this run instead of
            just the active one.
        resolve_all:
          type: boolean
          description: Alias for `all`.

    # ── SSE Events ─────────────────────────────────────────────────────
    RunEvent:
      description: |
        Server-Sent Event from a running agent.

        Wire format: the `/v1/runs/{run_id}/events` stream emits `data: {...}`
        frames only -- it does NOT set the SSE `event:` field. The event kind is
        carried by the **`event` JSON property**, which is the discriminator
        below. Clients that also read the SSE `event:` line must fall back to
        the `event` property.

        Events come in two families: Hermes native format
        (`run.*`, `message.*`, `tool.*`, `reasoning.*`, `approval.*`), which is
        what the runtime emits today, and Responses API format (`response.*`),
        retained for backwards compatibility with older clients.

        Sub-protocol (undocumented upstream, Hyver-specific): several logical
        event kinds are tunneled inside `reasoning.available` because the
        upstream callback forwards only three event types. They are
        discriminated by the `tool_name` slot with a JSON body in `text`:

        | `tool_name`    | `text` payload                                              |
        |----------------|-------------------------------------------------------------|
        | `_tool_io`     | `{"type":"input","tool","args","call_id"}` -- real tool args |
        | `_tool_io`     | `{"type":"output","tool","call_id","result"}`                |
        | `_subagent`    | `{"event":"subagent.*","subagent_id","goal","depth",...}`    |
        | `_compression` | plain context-compression status string                     |
        | `_reasoning`   | plain thinking text                                         |
        | `_thinking`    | suppressed (never emitted)                                  |

        Consumers MUST NOT treat a `reasoning.available` frame whose payload
        parses as one of the above as user-visible reasoning text.
      discriminator:
        propertyName: event
        mapping:
          "response.created": "#/components/schemas/ResponseCreatedEvent"
          "response.output_text.delta": "#/components/schemas/ContentDeltaEvent"
          "message.delta": "#/components/schemas/ContentDeltaEvent"
          "response.output_item.added": "#/components/schemas/OutputItemAddedEvent"
          "response.output_item.done": "#/components/schemas/OutputItemDoneEvent"
          "response.completed": "#/components/schemas/ResponseCompletedEvent"
          "response.failed": "#/components/schemas/ResponseFailedEvent"
          "tool.started": "#/components/schemas/ToolStartedEvent"
          "tool.completed": "#/components/schemas/ToolCompletedEvent"
          "tool.start": "#/components/schemas/ToolStartEvent"
          "tool.progress": "#/components/schemas/ToolProgressEvent"
          "hermes.tool.progress": "#/components/schemas/ToolProgressEvent"
          "tool.result": "#/components/schemas/ToolResultEvent"
          "reasoning.available": "#/components/schemas/ReasoningEvent"
          "response.reasoning": "#/components/schemas/ReasoningEvent"
          "hermes.reasoning": "#/components/schemas/ReasoningEvent"
          "approval.request": "#/components/schemas/ApprovalRequestEvent"
          "approval.responded": "#/components/schemas/ApprovalRespondedEvent"
          "approval.required": "#/components/schemas/ApprovalRequiredEvent"
          "hermes.approval_required": "#/components/schemas/ApprovalRequiredEvent"
          "hermes.usage": "#/components/schemas/UsageEvent"
          "run.completed": "#/components/schemas/RunCompletedEvent"
          "run.failed": "#/components/schemas/RunFailedEvent"
          "run.cancelled": "#/components/schemas/RunCancelledEvent"
          "error": "#/components/schemas/ErrorEvent"
          "done": "#/components/schemas/DoneEvent"
          "message_stop": "#/components/schemas/DoneEvent"
      oneOf:
        - $ref: "#/components/schemas/ResponseCreatedEvent"
        - $ref: "#/components/schemas/ContentDeltaEvent"
        - $ref: "#/components/schemas/OutputItemAddedEvent"
        - $ref: "#/components/schemas/OutputItemDoneEvent"
        - $ref: "#/components/schemas/ResponseCompletedEvent"
        - $ref: "#/components/schemas/ResponseFailedEvent"
        - $ref: "#/components/schemas/ToolStartedEvent"
        - $ref: "#/components/schemas/ToolCompletedEvent"
        - $ref: "#/components/schemas/ToolStartEvent"
        - $ref: "#/components/schemas/ToolProgressEvent"
        - $ref: "#/components/schemas/ToolResultEvent"
        - $ref: "#/components/schemas/ReasoningEvent"
        - $ref: "#/components/schemas/ApprovalRequestEvent"
        - $ref: "#/components/schemas/ApprovalRespondedEvent"
        - $ref: "#/components/schemas/ApprovalRequiredEvent"
        - $ref: "#/components/schemas/UsageEvent"
        - $ref: "#/components/schemas/RunCompletedEvent"
        - $ref: "#/components/schemas/RunFailedEvent"
        - $ref: "#/components/schemas/RunCancelledEvent"
        - $ref: "#/components/schemas/ErrorEvent"
        - $ref: "#/components/schemas/DoneEvent"

    # ── Individual SSE Event Schemas ───────────────────────────────────
    ResponseCreatedEvent:
      type: object
      required: [event]
      properties:
        event:
          type: string
          const: response.created

    ContentDeltaEvent:
      type: object
      required: [event, delta]
      properties:
        event:
          type: string
          enum: [response.output_text.delta, message.delta]
        delta:
          type: string
          description: Incremental text content.

    OutputItemAddedEvent:
      type: object
      required: [event, item]
      properties:
        event:
          type: string
          const: response.output_item.added
        item:
          $ref: "#/components/schemas/OutputItem"

    OutputItem:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [function_call, image, function_call_output]
        call_id:
          type: string
        name:
          type: string
          description: Function/tool name.
        arguments:
          type: string
          description: JSON-encoded function arguments.
        url:
          type: string
          description: Image URL (when type=image).
        title:
          type: string
        output:
          description: Function call output (string or array of text objects).
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                properties:
                  text:
                    type: string

    OutputItemDoneEvent:
      type: object
      required: [event, item]
      properties:
        event:
          type: string
          const: response.output_item.done
        item:
          $ref: "#/components/schemas/OutputItem"

    ResponseCompletedEvent:
      type: object
      required: [event]
      properties:
        event:
          type: string
          const: response.completed
        usage:
          $ref: "#/components/schemas/UsageInfo"
        model:
          type: string
        session_id:
          type: string

    ResponseFailedEvent:
      type: object
      required: [event]
      properties:
        event:
          type: string
          const: response.failed
        error:
          type: object
          properties:
            message:
              type: string

    ToolStartedEvent:
      description: |
        Emitted when the agent begins executing a tool. This is what the
        runtime actually sends (`tool.started`); `tool.start` is legacy.

        NOTE: this event carries only a truncated `preview`, never the full
        tool arguments. Arguments arrive separately, tunneled through
        `reasoning.available` with `tool_name: "_tool_io"`.
      type: object
      required: [event]
      properties:
        event:
          type: string
          const: tool.started
        run_id:
          type: string
        timestamp:
          type: number
          description: Unix epoch seconds.
        tool:
          type: string
          description: Tool identifier.
        preview:
          type: string
          description: Truncated, human-readable preview of the invocation.

    ToolCompletedEvent:
      description: |
        Emitted when a tool finishes. This is what the runtime actually sends
        (`tool.completed`); `tool.result` is legacy.

        NOTE: this event carries no result payload. Results arrive separately,
        tunneled through `reasoning.available` with `tool_name: "_tool_io"`.
      type: object
      required: [event]
      properties:
        event:
          type: string
          const: tool.completed
        run_id:
          type: string
        timestamp:
          type: number
          description: Unix epoch seconds.
        tool:
          type: string
          description: Tool identifier.
        duration:
          type: number
          description: Execution time in seconds, rounded to 3 decimals.
        error:
          type: boolean
          description: True when the tool raised.

    ToolStartEvent:
      type: object
      required: [event]
      properties:
        event:
          type: string
          const: tool.start
        tool:
          type: string
          description: Tool identifier.
        name:
          type: string
          description: Tool display name.
        call_id:
          type: string
        id:
          type: string
        input:
          type: object
          additionalProperties: true
          description: Tool invocation input parameters.

    ToolProgressEvent:
      type: object
      required: [event]
      properties:
        event:
          type: string
          enum: [tool.progress, hermes.tool.progress]
        tool:
          type: string
        name:
          type: string
        call_id:
          type: string

    ToolResultEvent:
      type: object
      required: [event]
      properties:
        event:
          type: string
          const: tool.result
        call_id:
          type: string
        tool:
          type: string
        output:
          description: Tool execution output.
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        result:
          type: string
          description: Alternative output field.

    ReasoningEvent:
      type: object
      required: [event, text]
      properties:
        event:
          type: string
          enum: [reasoning.available, response.reasoning, hermes.reasoning]
        text:
          type: string
          description: Reasoning/thinking text.

    ApprovalRequestEvent:
      description: |
        Emitted when a run with `metadata.human_control: true` hits an approval
        gate. The run status becomes `waiting_for_approval` and the executor
        blocks until `POST /v1/runs/{run_id}/approval` resolves it.

        This is what the runtime actually sends (`approval.request`).
        `approval.required` / `hermes.approval_required` are legacy aliases with
        a different, tool-centric payload and are not emitted.

        The payload is gate-centric, not tool-centric: there is no `tool` or
        `input` field. `pattern_key` identifies the gate that fired (for example
        `execute_code`, `mcp_elicitation`, or a shell warning key) and
        `command` is the redacted display form of the pending action.
      type: object
      required: [event]
      properties:
        event:
          type: string
          const: approval.request
        run_id:
          type: string
        timestamp:
          type: number
          description: Unix epoch seconds.
        command:
          type: string
          description: >-
            Redacted, human-readable display form of the action awaiting
            approval. Credentials are stripped before egress.
        description:
          type: string
          description: Human-readable explanation of why approval is required.
        pattern_key:
          type: string
          description: >-
            Primary gate identifier, e.g. `execute_code`, `mcp_elicitation`, or
            a shell command warning key.
        pattern_keys:
          type: array
          description: All gate identifiers that matched this action.
          items:
            type: string
        choices:
          type: array
          description: >-
            Allowed values for the `choice` field of the approval request.
            Normally `["once","session","always","deny"]`; reduced to
            `["once","deny"]` when `smart_denied` is true.
          items:
            type: string
            enum: [once, session, always, deny]
        allow_permanent:
          type: boolean
          description: False when `always` must not be offered.
        smart_denied:
          type: boolean
          description: >-
            True when the runtime pre-emptively flagged the action as dangerous.

    ApprovalRespondedEvent:
      description: |
        Acknowledgement that a pending approval was resolved. Informational --
        the run continues (or aborts) on its own after this event.
      type: object
      required: [event]
      properties:
        event:
          type: string
          const: approval.responded
        run_id:
          type: string
        timestamp:
          type: number
          description: Unix epoch seconds.
        choice:
          type: string
          enum: [once, session, always, deny]
          description: The normalized choice that was applied.
        resolved:
          type: boolean
          description: True when the blocked executor was released.

    ApprovalRequiredEvent:
      type: object
      required: [event]
      properties:
        event:
          type: string
          enum: [approval.required, hermes.approval_required]
        run_id:
          type: string
        tool:
          type: string
          description: Tool awaiting approval.
        input:
          type: object
          additionalProperties: true
          description: Proposed tool input.
        session_id:
          type: string

    UsageEvent:
      type: object
      required: [event]
      properties:
        event:
          type: string
          const: hermes.usage
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        total_tokens:
          type: integer
        system_prompt_tokens:
          type: integer
        model:
          type: string

    RunCompletedEvent:
      type: object
      required: [event]
      properties:
        event:
          type: string
          const: run.completed
        output:
          type: string
          description: Final assistant output for the run.
        usage:
          $ref: "#/components/schemas/UsageInfo"
        model:
          type: string
        session_id:
          type: string

    RunFailedEvent:
      type: object
      required: [event]
      properties:
        event:
          type: string
          const: run.failed
        error:
          description: Error details (string or object with message field).
          oneOf:
            - type: string
            - type: object
              properties:
                message:
                  type: string
        message:
          type: string
          description: Alternative error message field.

    RunCancelledEvent:
      description: |
        Terminal event emitted after `POST /v1/runs/{run_id}/stop`. Clients must
        treat this as stream-terminal; failing to do so leaves the stream
        looking like a recoverable disconnect and triggers pointless polling of
        a deliberately stopped run.
      type: object
      required: [event]
      properties:
        event:
          type: string
          const: run.cancelled
        run_id:
          type: string
        timestamp:
          type: number
          description: Unix epoch seconds.
        session_id:
          type: string

    ErrorEvent:
      type: object
      required: [event]
      properties:
        event:
          type: string
          const: error
        error:
          description: Error details (string or object with message field).
          oneOf:
            - type: string
            - type: object
              properties:
                message:
                  type: string
        message:
          type: string

    DoneEvent:
      type: object
      required: [event]
      properties:
        event:
          type: string
          enum: [done, message_stop]
        session_id:
          type: string

    # ── Shared ─────────────────────────────────────────────────────────
    UsageInfo:
      type: object
      properties:
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        total_tokens:
          type: integer
        system_prompt_tokens:
          type: integer

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            type:
              type: string
            code:
              type: string
            param:
              type: string
        message:
          type: string
          description: Alternative flat error message field.
