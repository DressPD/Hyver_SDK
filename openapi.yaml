openapi: 3.1.0
info:
  title: Hermes Runtime API
  version: 0.1.0
  description: |
    AI agent runtime API for Hyver. Provides health checks, chat completions
    (OpenAI-compatible via LiteLLM), and agent run management with SSE streaming.
  license:
    name: MIT

servers:
  - url: "{base_url}"
    description: Hermes Runtime server
    variables:
      base_url:
        default: http://localhost:8643

security:
  - BearerAuth: []

tags:
  - name: health
    description: Service health checks
  - name: capabilities
    description: Runtime capability discovery
  - name: chat
    description: OpenAI-compatible chat completions
  - name: runs
    description: Agent run management and streaming

paths:
  /health:
    get:
      operationId: check_health
      summary: Health check
      description: Returns service health status. No authentication required.
      security: []
      tags: [health]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/capabilities:
    get:
      operationId: get_capabilities
      summary: Get runtime capabilities
      description: |
        Returns available runtime capabilities. Proxied directly to the Hermes
        upstream service. No authentication required.
      security: []
      tags: [capabilities]
      responses:
        "200":
          description: Runtime capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"

  /v1/chat/completions:
    post:
      operationId: create_chat_completion
      summary: Create chat completion
      description: |
        OpenAI-compatible chat completion endpoint. Requests are routed through
        a model routing proxy that selects the appropriate model based on
        complexity and tier, then forwarded to LiteLLM.
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: Chat completion response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ChatCompletionChunk"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/runs:
    post:
      operationId: create_run
      summary: Create a new agent run
      description: |
        Creates a new agent run with the given input and configuration. Returns
        a run ID that can be used to stream events, submit approvals, or stop
        the run.
      tags: [runs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunCreateRequest"
      responses:
        "200":
          description: Run created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunCreateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/runs/{run_id}/events:
    get:
      operationId: stream_run_events
      summary: Stream run events via SSE
      description: |
        Opens a Server-Sent Events stream for the specified run. Events include
        content deltas, tool executions, reasoning steps, approval requests,
        usage statistics, and completion/failure signals.
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/RunEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/runs/{run_id}/approval:
    post:
      operationId: submit_run_approval
      summary: Submit approval decision for a run
      description: |
        Approves or rejects a pending action during a run that has
        human-in-the-loop control enabled.
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunApprovalRequest"
      responses:
        "200":
          description: Approval submitted
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/runs/{run_id}/stop:
    post:
      operationId: stop_run
      summary: Stop a running agent run
      description: Signals the runtime to stop the specified run.
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run stop requested
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito JWT token

  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
      description: Unique run identifier

  responses:
    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # ── Health ──────────────────────────────────────────────────────────
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [healthy]

    # ── Capabilities ───────────────────────────────────────────────────
    CapabilitiesResponse:
      type: object
      additionalProperties: true
      description: |
        Runtime capabilities. Schema varies by runtime version. Proxied
        directly from the Hermes upstream service.

    # ── Chat Completions (OpenAI-compatible) ───────────────────────────
    ChatCompletionRequest:
      type: object
      required: [messages]
      properties:
        model:
          type: string
          description: Model identifier. May be rewritten by the routing proxy.
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        temperature:
          type: number
          minimum: 0
          maximum: 2
        max_tokens:
          type: integer
        stream:
          type: boolean
          default: false
        top_p:
          type: number
          minimum: 0
          maximum: 1
        stop:
          oneOf:
            - type: string
            - type: array
              items:
                type: string

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string

    ChatCompletionResponse:
      type: object
      required: [id, object, created, choices]
      properties:
        id:
          type: string
        object:
          type: string
          enum: [chat.completion]
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            $ref: "#/components/schemas/ChatChoice"
        usage:
          $ref: "#/components/schemas/CompletionUsage"

    ChatChoice:
      type: object
      required: [index, message, finish_reason]
      properties:
        index:
          type: integer
        message:
          $ref: "#/components/schemas/ChatMessage"
        finish_reason:
          type: string
          enum: [stop, length, content_filter]
          nullable: true

    ChatCompletionChunk:
      type: object
      required: [id, object, created, choices]
      properties:
        id:
          type: string
        object:
          type: string
          enum: [chat.completion.chunk]
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            $ref: "#/components/schemas/ChatChunkChoice"

    ChatChunkChoice:
      type: object
      required: [index, delta]
      properties:
        index:
          type: integer
        delta:
          type: object
          properties:
            role:
              type: string
            content:
              type: string
        finish_reason:
          type: string
          nullable: true

    CompletionUsage:
      type: object
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer

    # ── Run Management ─────────────────────────────────────────────────
    RunCreateRequest:
      type: object
      required: [input, session_id]
      properties:
        input:
          type: string
          description: User message content, may include inline file context.
        session_id:
          type: string
          description: Session identifier for conversation continuity.
        instructions:
          type: string
          description: System instructions override for this run.
        images:
          type: array
          items:
            $ref: "#/components/schemas/ImageAttachment"
          description: Image attachments to include with the message.
        conversation_history:
          type: array
          items:
            $ref: "#/components/schemas/ConversationMessage"
          description: Prior conversation turns for context.
        metadata:
          $ref: "#/components/schemas/RunMetadata"
        tools:
          type: array
          items:
            type: string
          description: Tool identifiers to enable (e.g. "brave").

    RunCreateResponse:
      type: object
      properties:
        run_id:
          type: string
          description: Primary run identifier.
        id:
          type: string
          description: Alternative run identifier field.

    ImageAttachment:
      type: object
      required: [base64, mimeType]
      properties:
        base64:
          type: string
          description: Base64-encoded image data.
        mimeType:
          type: string
          description: "Image MIME type (e.g. image/png, image/jpeg)."
        fileName:
          type: string
        sizeBytes:
          type: integer

    ConversationMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string

    RunMetadata:
      type: object
      properties:
        reasoning:
          type: boolean
          description: Enable reasoning/thinking output.
        search_enabled:
          type: boolean
          description: Enable web search tool.
        human_control:
          type: boolean
          description: Enable human-in-the-loop approval for tool calls.

    RunApprovalRequest:
      type: object
      required: [approved]
      properties:
        approved:
          type: boolean
          description: Whether to approve the pending action.

    # ── SSE Events ─────────────────────────────────────────────────────
    RunEvent:
      description: |
        Server-Sent Event from a running agent. The `type` field discriminates
        the event kind. Events come in two families: Responses API format
        (response.*) and Hermes native format (run.*, message.*, tool.*, etc.).
      discriminator:
        propertyName: type
        mapping:
          "response.created": "#/components/schemas/ResponseCreatedEvent"
          "response.output_text.delta": "#/components/schemas/ContentDeltaEvent"
          "message.delta": "#/components/schemas/ContentDeltaEvent"
          "response.output_item.added": "#/components/schemas/OutputItemAddedEvent"
          "response.output_item.done": "#/components/schemas/OutputItemDoneEvent"
          "response.completed": "#/components/schemas/ResponseCompletedEvent"
          "response.failed": "#/components/schemas/ResponseFailedEvent"
          "tool.start": "#/components/schemas/ToolStartEvent"
          "tool.progress": "#/components/schemas/ToolProgressEvent"
          "hermes.tool.progress": "#/components/schemas/ToolProgressEvent"
          "tool.result": "#/components/schemas/ToolResultEvent"
          "reasoning.available": "#/components/schemas/ReasoningEvent"
          "response.reasoning": "#/components/schemas/ReasoningEvent"
          "hermes.reasoning": "#/components/schemas/ReasoningEvent"
          "approval.required": "#/components/schemas/ApprovalRequiredEvent"
          "hermes.approval_required": "#/components/schemas/ApprovalRequiredEvent"
          "hermes.usage": "#/components/schemas/UsageEvent"
          "run.completed": "#/components/schemas/RunCompletedEvent"
          "run.failed": "#/components/schemas/RunFailedEvent"
          "error": "#/components/schemas/ErrorEvent"
          "done": "#/components/schemas/DoneEvent"
          "message_stop": "#/components/schemas/DoneEvent"
      oneOf:
        - $ref: "#/components/schemas/ResponseCreatedEvent"
        - $ref: "#/components/schemas/ContentDeltaEvent"
        - $ref: "#/components/schemas/OutputItemAddedEvent"
        - $ref: "#/components/schemas/OutputItemDoneEvent"
        - $ref: "#/components/schemas/ResponseCompletedEvent"
        - $ref: "#/components/schemas/ResponseFailedEvent"
        - $ref: "#/components/schemas/ToolStartEvent"
        - $ref: "#/components/schemas/ToolProgressEvent"
        - $ref: "#/components/schemas/ToolResultEvent"
        - $ref: "#/components/schemas/ReasoningEvent"
        - $ref: "#/components/schemas/ApprovalRequiredEvent"
        - $ref: "#/components/schemas/UsageEvent"
        - $ref: "#/components/schemas/RunCompletedEvent"
        - $ref: "#/components/schemas/RunFailedEvent"
        - $ref: "#/components/schemas/ErrorEvent"
        - $ref: "#/components/schemas/DoneEvent"

    # ── Individual SSE Event Schemas ───────────────────────────────────
    ResponseCreatedEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: response.created

    ContentDeltaEvent:
      type: object
      required: [type, delta]
      properties:
        type:
          type: string
          enum: [response.output_text.delta, message.delta]
        delta:
          type: string
          description: Incremental text content.

    OutputItemAddedEvent:
      type: object
      required: [type, item]
      properties:
        type:
          type: string
          const: response.output_item.added
        item:
          $ref: "#/components/schemas/OutputItem"

    OutputItem:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [function_call, image, function_call_output]
        call_id:
          type: string
        name:
          type: string
          description: Function/tool name.
        arguments:
          type: string
          description: JSON-encoded function arguments.
        url:
          type: string
          description: Image URL (when type=image).
        title:
          type: string
        output:
          description: Function call output (string or array of text objects).
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                properties:
                  text:
                    type: string

    OutputItemDoneEvent:
      type: object
      required: [type, item]
      properties:
        type:
          type: string
          const: response.output_item.done
        item:
          $ref: "#/components/schemas/OutputItem"

    ResponseCompletedEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: response.completed
        usage:
          $ref: "#/components/schemas/UsageInfo"
        model:
          type: string
        session_id:
          type: string

    ResponseFailedEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: response.failed
        error:
          type: object
          properties:
            message:
              type: string

    ToolStartEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: tool.start
        tool:
          type: string
          description: Tool identifier.
        name:
          type: string
          description: Tool display name.
        call_id:
          type: string
        id:
          type: string
        input:
          type: object
          additionalProperties: true
          description: Tool invocation input parameters.

    ToolProgressEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [tool.progress, hermes.tool.progress]
        tool:
          type: string
        name:
          type: string
        call_id:
          type: string

    ToolResultEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: tool.result
        call_id:
          type: string
        tool:
          type: string
        output:
          description: Tool execution output.
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        result:
          type: string
          description: Alternative output field.

    ReasoningEvent:
      type: object
      required: [type, text]
      properties:
        type:
          type: string
          enum: [reasoning.available, response.reasoning, hermes.reasoning]
        text:
          type: string
          description: Reasoning/thinking text.

    ApprovalRequiredEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [approval.required, hermes.approval_required]
        run_id:
          type: string
        tool:
          type: string
          description: Tool awaiting approval.
        input:
          type: object
          additionalProperties: true
          description: Proposed tool input.
        session_id:
          type: string

    UsageEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: hermes.usage
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        total_tokens:
          type: integer
        system_prompt_tokens:
          type: integer
        model:
          type: string

    RunCompletedEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: run.completed
        usage:
          $ref: "#/components/schemas/UsageInfo"
        model:
          type: string
        session_id:
          type: string

    RunFailedEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: run.failed
        error:
          description: Error details (string or object with message field).
          oneOf:
            - type: string
            - type: object
              properties:
                message:
                  type: string
        message:
          type: string
          description: Alternative error message field.

    ErrorEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: error
        error:
          description: Error details (string or object with message field).
          oneOf:
            - type: string
            - type: object
              properties:
                message:
                  type: string
        message:
          type: string

    DoneEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [done, message_stop]
        session_id:
          type: string

    # ── Shared ─────────────────────────────────────────────────────────
    UsageInfo:
      type: object
      properties:
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        total_tokens:
          type: integer
        system_prompt_tokens:
          type: integer

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
